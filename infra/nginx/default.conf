access_log off;
error_log /var/log/nginx/error.log crit;
server {
    listen 80;
    server_name _;
    server_tokens off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;

    location /api/ {
        set $backend_origin http://backend:8000;
        proxy_pass $backend_origin;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / {
        set $frontend_origin http://frontend:80;
        proxy_pass $frontend_origin;
        proxy_set_header Host $host;
    }
}
