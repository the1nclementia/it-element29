access_log off;
error_log /var/log/nginx/error.log crit;
server {
    listen 80;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
