[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "it-element29-backend"
version = "0.1.0"
description = "ИТ-элемент [29]: серверный каркас"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "SQLAlchemy>=2.0,<2.1",
  "alembic>=1.13,<2",
  "pydantic-settings>=2,<3",
  "psycopg[binary]>=3.2,<4",
  "argon2-cffi>=25,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx2>=2,<3", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated disposable PostgreSQL database"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
