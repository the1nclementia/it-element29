# No access log: URLs can contain usernames/filter values. No request body/cookie logging.
access_log off;
error_log /var/log/nginx/error.log crit;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 443 ssl;
    server_name _;
    server_tokens off;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 10m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'" always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        set $api http://backend:8000;
        proxy_pass $api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_redirect off;
    }
    location / {
        set $ui http://frontend:80;
        proxy_pass $ui;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 5s;
    }
}

# Container-local readiness only; never published on host.
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    location = /api/v1/health/ready {
        set $api http://backend:8000;
        proxy_pass $api;
    }
    location / { return 404; }
}
